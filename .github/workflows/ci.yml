name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Empty, non-secret placeholders only -- docker-compose.yml references these
      # variables with no default, and CI must never depend on real NCMEC
      # credentials, a real .env file, or any repository secret.
      NCMEC_CLIENT_ID: ""
      NCMEC_CLIENT_SECRET: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run test suite
        run: docker compose run --rm api pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run test suite
        run: npm test

      - name: Build
        run: npm run build
