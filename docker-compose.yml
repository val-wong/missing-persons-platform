services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-missing_persons}
      POSTGRES_USER: ${POSTGRES_USER:-missing_persons}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-missing_persons}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-missing_persons}
      POSTGRES_USER: ${POSTGRES_USER:-missing_persons}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      NCMEC_CLIENT_ID: ${NCMEC_CLIENT_ID}
      NCMEC_CLIENT_SECRET: ${NCMEC_CLIENT_SECRET}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
      # Mounted as a sibling of app/ so `python -m ingestion...` resolves from /app.
      - ./ingestion:/app/ingestion

  web:
    image: node:20-slim
    working_dir: /app
    # No frontend Dockerfile -- a stock Node image plus a two-step command is enough
    # for local dev, and avoids maintaining a second build definition just for this.
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      # The browser (not this container) makes the API calls, so this must be a URL
      # reachable from the host -- the API's published port, not the compose network's
      # internal "api" hostname.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules

volumes:
  db_data:
  web_node_modules:
